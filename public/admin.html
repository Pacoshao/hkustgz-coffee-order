<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKUST(GZ) 咖啡系统 - 后台管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 1200px; margin: 0 auto; background: #f0f2f5; color: #333; line-height: 1.6; }
        .lang-toggle { position: absolute; top: 15px; right: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        h1 { font-size: 1.8em; margin-bottom: 20px; }
        h2 { font-size: 1.4em; margin-bottom: 15px; }
        
        /* Responsive Table */
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #fafafa; font-weight: 600; color: #666; }
        
        .status-Pending { color: #f39c12; font-weight: bold; }
        .status-Completed { color: #27ae60; font-weight: bold; }
        .status-Cancelled { color: #999; }

        button { padding: 8px 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
        button.primary { background: #0071e3; color: white; border: none; }
        button.danger { background: #ff3b30; color: white; border: none; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-btn { padding: 10px 18px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; color: #666; }
        .tab-btn.active { background: #0071e3; color: white; border-color: #0071e3; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #0071e3; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Global Options UI */
        .option-tag { display: inline-block; background: #eef2f7; padding: 2px 8px; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-size: 12px; border: 1px solid #d1d9e6; }
        .edit-options-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .options-box { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .option-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .option-row input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }

        .session-inputs { display: flex; flex: 1; gap: 5px; align-items: center; }
        .session-inputs input { flex: 1; min-width: 0; }
        .remove-session-btn { padding: 5px 12px; font-weight: bold; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 12px; }
            h1 { font-size: 1.4em; margin-bottom: 15px; }
            h2 { font-size: 1.2em; }
            .tabs { gap: 5px; }
            .tab-btn { padding: 8px 12px; font-size: 13px; }
            .header-actions { flex-direction: column; align-items: stretch; gap: 10px; }
            .action-btns { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .action-btns button { font-size: 12px; padding: 10px 5px; }
            .action-btns .danger { grid-column: span 2; }
            #last-refresh-time { grid-column: span 2; text-align: center; }
            
            .form-group input, .form-group textarea, .form-group select { font-size: 16px; } /* Prevent iOS zoom on focus */
            .options-box { width: 95%; padding: 15px; }
            .option-row { flex-direction: column; align-items: stretch; gap: 5px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
            
            .session-inputs { flex-direction: column; gap: 5px; }
            .session-inputs input { width: 100%; }
            .session-inputs .to-text { display: none; } /* Hide "to" text on mobile to save space */
            .remove-session-btn { align-self: flex-end; }
            
            /* Admin Menu Editing Specifics */
            #menu-list input { width: 100% !important; margin-bottom: 5px; }
            #menu-list td div { gap: 2px !important; }
        }
    </style>
</head>
<body>
    <div class="lang-toggle">
        <button onclick="toggleLang()" id="lang-btn" style="background:#8e8e93; font-size: 12px; padding: 5px 10px; color: white; border: none; border-radius: 4px; cursor: pointer;">English</button>
    </div>
    <div id="login-overlay">
        <div class="card" style="text-align: center; width: 85%; max-width: 350px;">
            <h2 data-i18n="admin_login">管理员登录</h2>
            <div class="form-group">
                <input type="password" id="admin-pw-input" placeholder="输入后台密码" data-i18n-placeholder="pw_placeholder" style="padding:12px; width:100%; box-sizing: border-box; font-size: 16px;">
            </div>
            <button class="primary" onclick="login()" style="width: 100%; padding: 12px;" data-i18n="login_btn">进入</button>
        </div>
    </div>

    <!-- 自定义选项编辑器 -->
    <div id="options-editor" class="edit-options-modal">
        <div class="options-box">
            <h3 style="margin-top:0" data-i18n="options_editor_title">配置自定义选项</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;" data-i18n="options_editor_hint">例如：分类为“甜度”，选项为“多糖,少糖,无糖”</p>
            <div id="options-rows-container"></div>
            <button onclick="addOptionRow()" style="width: 100%; margin-bottom: 15px; background: #f0f2f5;" data-i18n="add_option_group">+ 添加分组 (如甜度、冰量)</button>
            <div style="display: flex; gap: 10px;">
                <button class="primary" style="flex: 1" onclick="saveOptionsFromEditor()" data-i18n="confirm_close">确认并关闭</button>
                <button style="flex: 1" onclick="closeOptionsEditor()" data-i18n="cancel_btn">取消</button>
            </div>
        </div>
    </div>

    <h1>☕ HKUST(GZ) 咖啡后台</h1>
    
    <div class="tabs">
        <button id="tab-orders" class="tab-btn active" onclick="showTab('orders')" data-i18n="tab_orders">点单处理</button>
        <button id="tab-menu" class="tab-btn" onclick="showTab('menu')" data-i18n="tab_menu">菜单管理</button>
        <button id="tab-settings" class="tab-btn" onclick="showTab('settings')" data-i18n="tab_settings">系统设置</button>
    </div>

    <!-- 点单管理 -->
    <div id="section-orders" class="card">
        <div class="header-actions">
            <h2 data-i18n="orders_title">📋 点单记录</h2>
            <div class="action-btns">
                <span id="last-refresh-time" style="font-size: 12px; color: #999; align-self: center;"></span>
                <button class="primary" onclick="fetchOrders()" data-i18n="refresh">立即刷新</button>
                <button class="primary" onclick="exportOrders()" data-i18n="export">导出 CSV</button>
                <button class="danger" onclick="clearAllOrders()" data-i18n="clear_all">清空所有记录</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th data-i18n="order_num">点单号</th><th data-i18n="content">内容</th><th data-i18n="amount">金额</th><th data-i18n="status">状态</th><th data-i18n="actions">操作</th>
                    </tr>
                </thead>
                <tbody id="orders-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 菜单管理 -->
    <div id="section-menu" class="card" style="display:none">
        <h2 data-i18n="menu_title">🍴 菜单管理</h2>
        <div class="card" style="background: #f9f9f9; padding: 15px;">
            <h3 style="margin-top:0">添加新品</h3>
            <div class="form-group" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="m-name" placeholder="名称" data-i18n-placeholder="placeholder_name" style="flex: 1; min-width: 100px;">
                <input type="number" id="m-price" placeholder="价格" data-i18n-placeholder="placeholder_price" style="flex: 0.5; min-width: 80px;">
                <input type="number" id="m-stock" placeholder="库存数量" data-i18n-placeholder="placeholder_stock" style="flex: 0.5; min-width: 80px;">
                <input type="text" id="m-desc" placeholder="描述" data-i18n-placeholder="placeholder_desc" style="flex: 2; min-width: 120px;">
                <input type="text" id="m-options" placeholder="自定义选项" data-i18n-placeholder="placeholder_options" style="flex: 2; min-width: 150px;" readonly onclick="openOptionsEditor('m-options')">
                <button class="primary" onclick="addMenuItem()" style="flex: 1; min-width: 100px;">添加商品</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="name">名称</th><th data-i18n="price">价格</th><th data-i18n="description">描述</th><th data-i18n="stock_options">库存/选项</th><th data-i18n="status">状态</th><th data-i18n="action">操作</th>
                    </tr>
                </thead>
                <tbody id="menu-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 系统设置 -->
    <div id="section-settings" class="card" style="display:none">
        <h2 data-i18n="settings_title">⚙️ 系统设置</h2>
        <div class="card">
            <h3 data-i18n="tips_title">额外提示内容</h3>
            <div class="form-group">
                <label><input type="checkbox" id="tip-enabled"> <span data-i18n="enable_tips">启用提示</span></label>
                <textarea id="tip-text" style="width: 100%; height: 80px; margin-top: 10px; display: block; border: 1px solid #ddd; border-radius: 4px; padding: 10px;" placeholder="显示在首页顶部的提示内容..." data-i18n-placeholder="placeholder_tip"></textarea>
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3 data-i18n="redirect_title">下单后跳转</h3>
            <div class="form-group">
                <label><input type="checkbox" id="redirect-enabled"> <span data-i18n="enable_redirect">启用跳转</span></label>
                <input type="text" id="redirect-url" style="margin-top: 10px; display: block; width: 95%; border: 1px solid #ddd; border-radius: 4px; padding: 10px;" placeholder="例如: https://forms.office.com/..." data-i18n-placeholder="placeholder_redirect">
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3 data-i18n="refresh_title">自动刷新设置</h3>
            <div class="form-group">
                <label data-i18n="refresh_label">后台记录自动刷新间隔 (秒)</label>
                <input type="number" id="refresh-interval" style="width: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 10px;" min="5" value="30">
                <p style="font-size: 12px; color: #999; margin-top: 5px;" data-i18n="refresh_hint">建议 10s 以上以平衡实时性与负载。</p>
            </div>
        </div>

        <div class="card" style="margin-top: 20px; border: 2px solid #0071e3; background: #f8fbff;">
            <h3 data-i18n="business_title">⏰ 营业时段设置</h3>
            <div class="form-group">
                <label style="color: #0071e3; font-weight: bold;"><input type="checkbox" id="sessions-enabled"> <span data-i18n="enable_sessions">启用营业时段限制</span></label>
                <p style="font-size: 12px; color: #666; margin-top: 5px;" data-i18n="business_hint">如果不启用，系统将全天 24 小时开放下单。</p>
            </div>
            <div id="sessions-container"></div>
            <button onclick="addSessionRow()" style="margin-top: 10px; width: 100%; padding: 10px; background: #fff; border: 1px dashed #0071e3; color: #0071e3; border-radius: 8px; cursor: pointer; font-weight: bold;" data-i18n="add_session">+ 添加新营业时段</button>
            <p style="font-size: 12px; color: #666; margin-top: 10px;" data-i18n="session_hint">选择起始日期时间与结束日期时间。例如：2026/02/06 08:30 至 17:30</p>
        </div>

        <button class="primary" style="margin-top: 20px; width: 100%; padding: 12px;" onclick="saveSettings()" data-i18n="save_settings">保存所有设置</button>
    </div>

    <script>
        const i18n = {
            'zh-CN': {
                admin_login: '管理员登录',
                pw_placeholder: '输入后台密码',
                login_btn: '进入',
                tab_orders: '点单处理',
                tab_menu: '菜单管理',
                tab_settings: '系统设置',
                orders_title: '📋 点单记录',
                refresh: '立即刷新',
                export: '导出 CSV',
                clear_all: '清空所有记录',
                order_num: '点单号',
                content: '内容',
                amount: '金额',
                status: '状态',
                actions: '操作',
                complete: '完成',
                cancel: '取消',
                last_refresh: '上次刷新',
                save_settings: '保存所有设置',
                settings_saved: '设置已保存',
                pending: '制作中',
                completed: '已完成',
                cancelled: '已取消',
                menu_title: '🍴 菜单管理',
                add_item: '添加商品',
                name: '名称',
                price: '价格',
                description: '描述',
                stock_options: '库存/选项',
                action: '操作',
                settings_title: '⚙️ 系统设置',
                tips_title: '额外提示内容',
                enable_tips: '启用提示',
                redirect_title: '下单后跳转',
                enable_redirect: '启用跳转',
                refresh_title: '自动刷新设置',
                refresh_label: '后台记录自动刷新间隔 (秒)',
                business_title: '⏰ 营业时段设置',
                enable_sessions: '启用营业时段限制',
                add_session: '+ 添加新营业时段',
                to: '至',
                options_editor_title: '配置自定义选项',
                options_editor_hint: '例如：分类为“甜度”，选项为“多糖,少糖,无糖”',
                add_option_group: '+ 添加分组 (如甜度、冰量)',
                confirm_close: '确认并关闭',
                cancel_btn: '取消',
                placeholder_name: '名称',
                placeholder_price: '价格',
                placeholder_stock: '库存数量',
                placeholder_desc: '描述',
                placeholder_options: '自定义选项',
                placeholder_tip: '显示在首页顶部的提示内容...',
                placeholder_redirect: '例如: https://forms.office.com/...',
                business_hint: '如果不启用，系统将全天 24 小时开放下单。',
                session_hint: '选择起始日期时间与结束日期时间。例如：2026/02/06 08:30 至 17:30',
                refresh_hint: '建议 10s 以上以平衡实时性与负载。'
            },
            'en': {
                admin_login: 'Admin Login',
                pw_placeholder: 'Enter password',
                login_btn: 'Login',
                tab_orders: 'Orders',
                tab_menu: 'Menu',
                tab_settings: 'Settings',
                orders_title: '📋 Order Records',
                refresh: 'Refresh',
                export: 'Export CSV',
                clear_all: 'Clear All',
                order_num: 'Order #',
                content: 'Content',
                amount: 'Amount',
                status: 'Status',
                actions: 'Actions',
                complete: 'Finish',
                cancel: 'Cancel',
                last_refresh: 'Last refresh',
                save_settings: 'Save All Settings',
                settings_saved: 'Settings saved',
                pending: 'Pending',
                completed: 'Completed',
                cancelled: 'Cancelled',
                menu_title: '🍴 Menu Management',
                add_item: 'Add Item',
                name: 'Name',
                price: 'Price',
                description: 'Description',
                stock_options: 'Stock/Options',
                action: 'Action',
                settings_title: '⚙️ System Settings',
                tips_title: 'Extra Tips Content',
                enable_tips: 'Enable Tips',
                redirect_title: 'Redirect after Order',
                enable_redirect: 'Enable Redirect',
                refresh_title: 'Auto Refresh Setup',
                refresh_label: 'Admin Refresh Interval (sec)',
                business_title: '⏰ Business Sessions',
                enable_sessions: 'Enable Session Limits',
                add_session: '+ Add New Session',
                to: 'to',
                options_editor_title: 'Configure Custom Options',
                options_editor_hint: 'Example: Category "Sweetness", Options "Full, Less, None"',
                add_option_group: '+ Add Group (e.g., Sweetness, Ice)',
                confirm_close: 'Confirm & Close',
                cancel_btn: 'Cancel',
                placeholder_name: 'Name',
                placeholder_price: 'Price',
                placeholder_stock: 'Stock Quantity',
                placeholder_desc: 'Description',
                placeholder_options: 'Custom Options',
                placeholder_tip: 'Tips displayed at the top of the homepage...',
                placeholder_redirect: 'e.g., https://forms.office.com/...',
                business_hint: 'If disabled, the system will be open 24/7.',
                session_hint: 'Select start/end date & time. Example: 2026/02/06 08:30 to 17:30',
                refresh_hint: 'Suggest 10s+ to balance responsiveness and load.'
            }
        };

        let currentLang = localStorage.getItem('lang');
        if (!currentLang) {
            currentLang = navigator.language.startsWith('en') ? 'en' : 'zh-CN';
        }
        let adminPassword = '';
        let refreshTimer = null;
        let currentEditingOptionsInputId = '';

        function toggleLang() {
            currentLang = currentLang === 'zh-CN' ? 'en' : 'zh-CN';
            localStorage.setItem('lang', currentLang);
            updateUI();
        }

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function updateUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
            const langBtn = document.getElementById('lang-btn');
            if (langBtn) langBtn.innerText = currentLang === 'zh-CN' ? 'English' : '中文';
            if (adminPassword) {
                fetchOrders();
                fetchMenu();
            }
        }

        function login() {
            adminPassword = document.getElementById('admin-pw-input').value;
            if (!adminPassword) return;
            document.getElementById('login-overlay').style.display = 'none';
            refreshAll();
        }

        /* Options Editor Logic */
        function openOptionsEditor(inputId) {
            currentEditingOptionsInputId = inputId;
            const container = document.getElementById('options-rows-container');
            container.innerHTML = '';
            
            const rawValue = document.getElementById(inputId).value;
            if (rawValue) {
                const groups = rawValue.split('|');
                groups.forEach(g => {
                    const [name, choices] = g.split(':');
                    addOptionRow(name.trim(), choices.trim());
                });
            } else {
                addOptionRow('', '');
            }
            
            document.getElementById('options-editor').style.display = 'flex';
        }

        function addOptionRow(label = '', values = '') {
            const container = document.getElementById('options-rows-container');
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <input type="text" placeholder="分类(如甜度)" class="opt-label" value="${label}">
                <input type="text" placeholder="选项(用逗号分隔)" class="opt-values" value="${values}">
                <button class="danger" onclick="this.parentElement.remove()" style="padding: 5px 10px;">×</button>
            `;
            container.appendChild(row);
        }

        function closeOptionsEditor() {
            document.getElementById('options-editor').style.display = 'none';
        }

        function saveOptionsFromEditor() {
            const container = document.getElementById('options-rows-container');
            const rows = container.querySelectorAll('.option-row');
            const parts = [];
            rows.forEach(row => {
                const label = row.querySelector('.opt-label').value.trim();
                const values = row.querySelector('.opt-values').value.trim();
                if (label && values) {
                    parts.push(`${label}:${values}`);
                }
            });
            document.getElementById(currentEditingOptionsInputId).value = parts.join('|');
            closeOptionsEditor();
        }

        function showTab(tab) {
            document.getElementById('section-orders').style.display = tab === 'orders' ? 'block' : 'none';
            document.getElementById('section-menu').style.display = tab === 'menu' ? 'block' : 'none';
            document.getElementById('section-settings').style.display = tab === 'settings' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        async function api(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(path, options);
            if (res.status === 401) {
                alert('密码错误！');
                location.reload();
            }
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text);
            }
            return res;
        }

        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                data.forEach(s => {
                    if (s.SettingKey === 'extra_tip') {
                        document.getElementById('tip-enabled').checked = s.IsEnabled;
                        document.getElementById('tip-text').value = s.SettingValue || '';
                    } else if (s.SettingKey === 'redirect_url') {
                        document.getElementById('redirect-enabled').checked = s.IsEnabled;
                        document.getElementById('redirect-url').value = s.SettingValue || '';
                    } else if (s.SettingKey === 'refresh_interval') {
                        document.getElementById('refresh-interval').value = s.SettingValue || '30';
                        setupAutoRefresh(parseInt(s.SettingValue || '30'));
                    } else if (s.SettingKey === 'business_sessions_enabled') {
                        document.getElementById('sessions-enabled').checked = s.IsEnabled;
                    } else if (s.SettingKey === 'business_sessions_list') {
                        renderSessions(s.SettingValue || '[]');
                    }
                });
            } catch (e) {
                console.error('Fetch settings error:', e);
            }
        }

        function addSessionRow(start = '', end = '') {
            const container = document.getElementById('sessions-container');
            const row = document.createElement('div');
            row.className = 'option-row session-row-item';
            row.style.marginBottom = '10px';
            row.innerHTML = `
                <div class="session-inputs">
                    <input type="datetime-local" class="session-start" value="${start}">
                    <span class="to-text" data-i18n="to">${t('to')}</span>
                    <input type="datetime-local" class="session-end" value="${end}">
                </div>
                <button class="danger remove-session-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        function renderSessions(jsonStr) {
            const container = document.getElementById('sessions-container');
            container.innerHTML = '';
            try {
                const sessions = JSON.parse(jsonStr);
                sessions.forEach(s => addSessionRow(s.start, s.end));
            } catch(e) {}
        }

        function setupAutoRefresh(seconds) {
            if (refreshTimer) clearInterval(refreshTimer);
            if (seconds < 5) seconds = 5; // Minimum 5s
            refreshTimer = setInterval(() => {
                if (adminPassword) fetchOrders();
            }, seconds * 1000);
        }

        async function saveSettings() {
            const settings = [
                {
                    SettingKey: 'extra_tip',
                    SettingValue: document.getElementById('tip-text').value,
                    IsEnabled: document.getElementById('tip-enabled').checked
                },
                {
                    SettingKey: 'redirect_url',
                    SettingValue: document.getElementById('redirect-url').value,
                    IsEnabled: document.getElementById('redirect-enabled').checked
                },
                {
                    SettingKey: 'refresh_interval',
                    SettingValue: document.getElementById('refresh-interval').value,
                    IsEnabled: true
                },
                {
                    SettingKey: 'business_sessions_enabled',
                    SettingValue: '1',
                    IsEnabled: document.getElementById('sessions-enabled').checked
                },
                {
                    SettingKey: 'business_sessions_list',
                    SettingValue: JSON.stringify(Array.from(document.querySelectorAll('#sessions-container .option-row')).map(row => ({
                        start: row.querySelector('.session-start').value,
                        end: row.querySelector('.session-end').value
                    })).filter(s => s.start && s.end)),
                    IsEnabled: true
                }
            ];
            try {
                await api('/api/admin/settings', 'PUT', settings);
                alert('设置已保存');
                await fetchSettings();
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        async function fetchOrders() {
            try {
                const res = await api('/api/orders');
                const data = await res.json();
                document.getElementById('orders-list').innerHTML = data.map(o => `
                    <tr>
                        <td>${o.Id}</td><td>${o.CustomerName}</td><td>${o.ItemSummary}</td><td>¥${o.TotalPrice.toFixed(2)}</td>
                        <td class="status-${o.Status}">${o.Status === 'Pending' ? t('pending') : (o.Status === 'Completed' ? t('completed') : t('cancelled'))}</td>
                        <td>
                            ${o.Status === 'Pending' ? `<button onclick="completeOrder(${o.Id})">${t('complete')}</button>` : ''}
                            ${o.Status === 'Pending' ? `<button class="danger" onclick="cancelOrder(${o.Id})">${t('cancel')}</button>` : ''}
                        </td>
                    </tr>
                `).join('');
                document.getElementById('last-refresh-time').innerText = t('last_refresh') + ': ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error('Fetch orders error:', e);
            }
        }

        async function exportOrders() {
            try {
                const res = await fetch('/api/admin/orders/export', {
                    headers: { 'x-admin-password': adminPassword }
                });
                if (!res.ok) throw new Error('导出失败');
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `orders_${new Date().toLocaleDateString()}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) { alert(e.message); }
        }

        async function clearAllOrders() {
            if (!confirm('确定清空所有订单记录吗？此操作不可恢复！')) return;
            try {
                await api('/api/admin/orders', 'DELETE');
                refreshAll();
            } catch (e) { alert('清销失败: ' + e.message); }
        }

        async function cancelOrder(id) {
            if (!confirm('确定取消该订单吗？')) return;
            try {
                await api(`/api/orders/${id}`, 'PUT', { status: 'Cancelled' });
                fetchOrders();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function fetchMenu() {
            try {
                const res = await api('/api/admin/menu'); 
                const data = await res.json();
                document.getElementById('menu-list').innerHTML = data.map(m => `
                    <tr>
                        <td><input type="text" value="${m.Name}" id="name-${m.Id}" style="width:100px"></td>
                        <td><input type="number" value="${m.Price}" id="price-${m.Id}" style="width:60px"></td>
                        <td><input type="text" value="${m.Description || ''}" id="desc-${m.Id}" style="width:120px"></td>
                        <td>
                            <div style="display:flex; flex-direction:column; gap:5px">
                                <input type="number" value="${m.StockQuantity}" id="stock-${m.Id}" style="width:60px" placeholder="库存">
                                <input type="text" value="${m.CustomOptions || ''}" id="options-${m.Id}" placeholder="无自定义选项" style="width:150px; font-size:12px; cursor:pointer" readonly onclick="openOptionsEditor('options-${m.Id}')">
                                <button onclick="updateMenu(${m.Id}, ${m.IsAvailable})" style="padding: 4px">保存更新</button>
                            </div>
                        </td>
                        <td style="color: ${m.StockQuantity > 0 && m.IsAvailable ? 'green' : 'red'}">
                            ${m.IsAvailable ? (m.StockQuantity > 0 ? '在售' : '已售罄') : '已下架'}
                        </td>
                        <td>
                            <button onclick="toggleMenu(${m.Id}, ${m.IsAvailable})">${m.IsAvailable ? '下架' : '上架'}</button>
                            <button class="danger" onclick="deleteMenu(${m.Id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Fetch menu error:', e);
            }
        }

        async function updateMenu(id, isAvailable) {
            const name = document.getElementById('name-' + id).value;
            const price = document.getElementById('price-' + id).value;
            const description = document.getElementById('desc-' + id).value;
            const stockQuantity = document.getElementById('stock-' + id).value;
            const customOptions = document.getElementById('options-' + id).value;
            try {
                await api(`/api/admin/menu/${id}`, 'PUT', { name, price, isAvailable, stockQuantity, description, customOptions });
                alert('已更新');
                fetchMenu();
            } catch (e) { alert('更新失败: ' + e.message); }
        }

        async function toggleMenu(id, currentStatus) {
            const name = document.getElementById('name-' + id).value;
            const price = document.getElementById('price-' + id).value;
            const description = document.getElementById('desc-' + id).value;
            const stockQuantity = document.getElementById('stock-' + id).value;
            const customOptions = document.getElementById('options-' + id).value;
            try {
                await api(`/api/admin/menu/${id}`, 'PUT', { name, price, isAvailable: !currentStatus, stockQuantity, description, customOptions });
                fetchMenu();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function completeOrder(id) {
            try {
                await api(`/api/orders/${id}`, 'PUT', { status: 'Completed' });
                fetchOrders();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function addMenuItem() {
            try {
                const name = document.getElementById('m-name').value;
                const price = document.getElementById('m-price').value;
                const description = document.getElementById('m-desc').value || '';
                const stockQuantity = document.getElementById('m-stock').value || 0;
                const customOptions = document.getElementById('m-options').value || '';
                if (!name || !price) return alert('请填写名称和价格');
                await api('/api/admin/menu', 'POST', { name, price, description, category: 'Coffee', stockQuantity, customOptions });
                fetchMenu();
                document.getElementById('m-name').value = '';
                document.getElementById('m-price').value = '';
                document.getElementById('m-desc').value = '';
                document.getElementById('m-stock').value = '';
                document.getElementById('m-options').value = '';
            } catch (e) { alert('添加失败: ' + e.message); }
        }

        async function deleteMenu(id) {
            if (confirm('确定删除吗？（如果该咖啡已有订单记录，删除可能会失败，建议使用“下架”）')) {
                try {
                    await api(`/api/admin/menu/${id}`, 'DELETE');
                    fetchMenu();
                } catch (e) {
                    alert('删除失败：此商品可能已有历史点单关联，数据库禁止删除。请点击“下架”来隐藏它。');
                }
            }
        }

        function refreshAll() {
            fetchOrders();
            fetchMenu();
            fetchSettings();
        }

        // Init
        updateUI();
    </script>
    <div style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
        <a href="https://github.com/Pacoshao" target="_blank" style="text-decoration: none; color: #666; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; transition: all 0.3s;">
            <img src="https://github.com/Pacoshao.png" style="width: 24px; height: 24px; border-radius: 50%;">
            <span>GitHub @Pacoshao</span>
        </a>
    </div>
</body>
