<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HKUST(GZ) 咖啡系统 - 后台管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 1200px; margin: 0 auto; background: #f0f2f5; color: #333; line-height: 1.6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        h1 { font-size: 1.8em; margin-bottom: 20px; }
        h2 { font-size: 1.4em; margin-bottom: 15px; }
        
        /* Responsive Table */
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #fafafa; font-weight: 600; color: #666; }
        
        .status-Pending { color: #f39c12; font-weight: bold; }
        .status-Completed { color: #27ae60; font-weight: bold; }
        .status-Cancelled { color: #999; }

        button { padding: 8px 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
        button.primary { background: #0071e3; color: white; border: none; }
        button.danger { background: #ff3b30; color: white; border: none; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-btn { padding: 10px 18px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; color: #666; }
        .tab-btn.active { background: #0071e3; color: white; border-color: #0071e3; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #0071e3; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Global Options UI */
        .option-tag { display: inline-block; background: #eef2f7; padding: 2px 8px; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-size: 12px; border: 1px solid #d1d9e6; }
        .edit-options-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .options-box { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .option-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .option-row input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 15px; }
            h1 { font-size: 1.5em; }
            .header-actions { flex-direction: column; align-items: flex-start; }
            .action-btns { width: 100%; }
            .action-btns button { flex: 1; text-align: center; }
            .form-group input[type="number"] { width: 100% !important; }
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="card">
            <h2>管理员登录</h2>
            <input type="password" id="admin-pw-input" placeholder="输入后台密码" style="padding:10px; width:200px">
            <button class="primary" onclick="login()">进入</button>
        </div>
    </div>

    <!-- 自定义选项编辑器 -->
    <div id="options-editor" class="edit-options-modal">
        <div class="options-box">
            <h3 style="margin-top:0">配置自定义选项</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">例如：分类为“甜度”，选项为“多糖,少糖,无糖”</p>
            <div id="options-rows-container"></div>
            <button onclick="addOptionRow()" style="width: 100%; margin-bottom: 15px; background: #f0f2f5;">+ 添加分组 (如甜度、冰量)</button>
            <div style="display: flex; gap: 10px;">
                <button class="primary" style="flex: 1" onclick="saveOptionsFromEditor()">确认并关闭</button>
                <button style="flex: 1" onclick="closeOptionsEditor()">取消</button>
            </div>
        </div>
    </div>

    <h1>☕ HKUST(GZ) 咖啡后台</h1>
    
    <div class="tabs">
        <button id="tab-orders" class="tab-btn active" onclick="showTab('orders')">点单处理</button>
        <button id="tab-menu" class="tab-btn" onclick="showTab('menu')">菜单管理</button>
        <button id="tab-settings" class="tab-btn" onclick="showTab('settings')">系统设置</button>
    </div>

    <!-- 点单管理 -->
    <div id="section-orders" class="card">
        <div class="header-actions">
            <h2>📋 点单记录</h2>
            <div class="action-btns">
                <span id="last-refresh-time" style="font-size: 12px; color: #999; align-self: center;"></span>
                <button class="primary" onclick="fetchOrders()">立即刷新</button>
                <button class="primary" onclick="exportOrders()">导出 CSV</button>
                <button class="danger" onclick="clearAllOrders()">清空所有记录</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>点单暗号</th><th>内容</th><th>金额</th><th>状态</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="orders-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 菜单管理 -->
    <div id="section-menu" class="card" style="display:none">
        <h2>🍔 菜单管理</h2>
        <div class="card" style="background: #f9f9f9; padding: 15px;">
            <h3 style="margin-top:0">添加新品</h3>
            <div class="form-group" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="m-name" placeholder="名称" style="flex: 1; min-width: 120px;">
                <input type="number" id="m-price" placeholder="价格" style="flex: 0.5; min-width: 80px;">
                <input type="number" id="m-stock" placeholder="库存数量" style="flex: 0.5; min-width: 80px;">
                <input type="text" id="m-desc" placeholder="描述" style="flex: 2; min-width: 120px;">
                <input type="text" id="m-options" placeholder="自定义选项" style="flex: 2; min-width: 150px;" readonly onclick="openOptionsEditor('m-options')">
                <button class="primary" onclick="addMenuItem()" style="flex: 1; min-width: 100px;">添加商品</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>名称</th><th>价格</th><th>描述</th><th>库存/选项</th><th>状态</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="menu-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 系统设置 -->
    <div id="section-settings" class="card" style="display:none">
        <h2>⚙️ 系统设置</h2>
        <div class="card">
            <h3>额外提示内容</h3>
            <div class="form-group">
                <label><input type="checkbox" id="tip-enabled"> 启用提示</label>
                <textarea id="tip-text" style="width: 100%; height: 80px; margin-top: 10px; display: block; border: 1px solid #ddd; border-radius: 4px; padding: 10px;" placeholder="显示在首页顶部的提示内容..."></textarea>
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3>下单后跳转</h3>
            <div class="form-group">
                <label><input type="checkbox" id="redirect-enabled"> 启用跳转</label>
                <input type="text" id="redirect-url" style="margin-top: 10px; display: block; width: 95%; border: 1px solid #ddd; border-radius: 4px; padding: 10px;" placeholder="例如: https://forms.office.com/...">
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3>自动刷新设置</h3>
            <div class="form-group">
                <label>后台记录自动刷新间隔 (秒)</label>
                <input type="number" id="refresh-interval" style="width: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 10px;" min="5" value="30">
                <p style="font-size: 12px; color: #999; margin-top: 5px;">建议 10s 以上以平衡实时性与负载。</p>
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3>⏰ 营业时间设置</h3>
            <div class="form-group">
                <label><input type="checkbox" id="hours-enabled"> 启用营业时间限制</label>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 120px;">
                    <label>开始时间</label>
                    <input type="time" id="hours-start">
                </div>
                <div class="form-group" style="flex: 1; min-width: 120px;">
                    <label>结束时间</label>
                    <input type="time" id="hours-end">
                </div>
            </div>
            <p style="font-size: 12px; color: #999;">超出此时间段，系统将禁止用户提交新点单。</p>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h3>📅 特定营业日期 (日期白名单)</h3>
            <div class="form-group">
                <label><input type="checkbox" id="dates-enabled"> 仅允许在以下日期点单</label>
                <textarea id="dates-list" style="width: 100%; height: 80px; margin-top: 10px; display: block; border: 1px solid #ddd; border-radius: 8px; padding: 10px;" placeholder="例如: 2026-02-06, 2026-02-14 (以逗号分隔)"></textarea>
                <p style="font-size: 12px; color: #999; margin-top: 5px;">如果开启此项，只有在列表中的日期才允许下单。格式：YYYY-MM-DD</p>
            </div>
        </div>
        <button class="primary" style="margin-top: 20px; width: 100%; padding: 12px;" onclick="saveSettings()">保存所有设置</button>
    </div>

    <script>
        let adminPassword = '';
        let refreshTimer = null;
        let currentEditingOptionsInputId = '';

        function login() {
            adminPassword = document.getElementById('admin-pw-input').value;
            if (!adminPassword) return;
            document.getElementById('login-overlay').style.display = 'none';
            refreshAll();
        }

        /* Options Editor Logic */
        function openOptionsEditor(inputId) {
            currentEditingOptionsInputId = inputId;
            const container = document.getElementById('options-rows-container');
            container.innerHTML = '';
            
            const rawValue = document.getElementById(inputId).value;
            if (rawValue) {
                const groups = rawValue.split('|');
                groups.forEach(g => {
                    const [name, choices] = g.split(':');
                    addOptionRow(name.trim(), choices.trim());
                });
            } else {
                addOptionRow('', '');
            }
            
            document.getElementById('options-editor').style.display = 'flex';
        }

        function addOptionRow(label = '', values = '') {
            const container = document.getElementById('options-rows-container');
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <input type="text" placeholder="分类(如甜度)" class="opt-label" value="${label}">
                <input type="text" placeholder="选项(用逗号分隔)" class="opt-values" value="${values}">
                <button class="danger" onclick="this.parentElement.remove()" style="padding: 5px 10px;">×</button>
            `;
            container.appendChild(row);
        }

        function closeOptionsEditor() {
            document.getElementById('options-editor').style.display = 'none';
        }

        function saveOptionsFromEditor() {
            const container = document.getElementById('options-rows-container');
            const rows = container.querySelectorAll('.option-row');
            const parts = [];
            rows.forEach(row => {
                const label = row.querySelector('.opt-label').value.trim();
                const values = row.querySelector('.opt-values').value.trim();
                if (label && values) {
                    parts.push(`${label}:${values}`);
                }
            });
            document.getElementById(currentEditingOptionsInputId).value = parts.join('|');
            closeOptionsEditor();
        }

        function showTab(tab) {
            document.getElementById('section-orders').style.display = tab === 'orders' ? 'block' : 'none';
            document.getElementById('section-menu').style.display = tab === 'menu' ? 'block' : 'none';
            document.getElementById('section-settings').style.display = tab === 'settings' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        async function api(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(path, options);
            if (res.status === 401) {
                alert('密码错误！');
                location.reload();
            }
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text);
            }
            return res;
        }

        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                data.forEach(s => {
                    if (s.SettingKey === 'extra_tip') {
                        document.getElementById('tip-enabled').checked = s.IsEnabled;
                        document.getElementById('tip-text').value = s.SettingValue || '';
                    } else if (s.SettingKey === 'redirect_url') {
                        document.getElementById('redirect-enabled').checked = s.IsEnabled;
                        document.getElementById('redirect-url').value = s.SettingValue || '';
                    } else if (s.SettingKey === 'refresh_interval') {
                        document.getElementById('refresh-interval').value = s.SettingValue || '30';
                        setupAutoRefresh(parseInt(s.SettingValue || '30'));
                    } else if (s.SettingKey === 'business_hours_start') {
                        document.getElementById('hours-start').value = s.SettingValue || '08:00';
                    } else if (s.SettingKey === 'business_hours_end') {
                        document.getElementById('hours-end').value = s.SettingValue || '20:00';
                    } else if (s.SettingKey === 'business_hours_enabled') {
                        document.getElementById('hours-enabled').checked = s.IsEnabled;
                    } else if (s.SettingKey === 'business_dates_list') {
                        document.getElementById('dates-list').value = s.SettingValue || '';
                    } else if (s.SettingKey === 'business_dates_enabled') {
                        document.getElementById('dates-enabled').checked = s.IsEnabled;
                    }
                });
            } catch (e) {
                console.error('Fetch settings error:', e);
            }
        }

        function setupAutoRefresh(seconds) {
            if (refreshTimer) clearInterval(refreshTimer);
            if (seconds < 5) seconds = 5; // Minimum 5s
            refreshTimer = setInterval(() => {
                if (adminPassword) fetchOrders();
            }, seconds * 1000);
        }

        async function saveSettings() {
            const settings = [
                {
                    SettingKey: 'extra_tip',
                    SettingValue: document.getElementById('tip-text').value,
                    IsEnabled: document.getElementById('tip-enabled').checked
                },
                {
                    SettingKey: 'redirect_url',
                    SettingValue: document.getElementById('redirect-url').value,
                    IsEnabled: document.getElementById('redirect-enabled').checked
                },
                {
                    SettingKey: 'refresh_interval',
                    SettingValue: document.getElementById('refresh-interval').value,
                    IsEnabled: true
                },
                {
                    SettingKey: 'business_hours_start',
                    SettingValue: document.getElementById('hours-start').value,
                    IsEnabled: true
                },
                {
                    SettingKey: 'business_hours_end',
                    SettingValue: document.getElementById('hours-end').value,
                    IsEnabled: true
                },
                {
                    SettingKey: 'business_hours_enabled',
                    SettingValue: '1',
                    IsEnabled: document.getElementById('hours-enabled').checked
                },
                {
                    SettingKey: 'business_dates_list',
                    SettingValue: document.getElementById('dates-list').value,
                    IsEnabled: true
                },
                {
                    SettingKey: 'business_dates_enabled',
                    SettingValue: '1',
                    IsEnabled: document.getElementById('dates-enabled').checked
                }
            ];
            try {
                await api('/api/admin/settings', 'PUT', settings);
                alert('设置已保存');
                await fetchSettings();
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        async function fetchOrders() {
            try {
                const res = await api('/api/orders');
                const data = await res.json();
                document.getElementById('orders-list').innerHTML = data.map(o => `
                    <tr>
                        <td>${o.Id}</td><td>${o.CustomerName}</td><td>${o.ItemSummary}</td><td>¥${o.TotalPrice.toFixed(2)}</td>
                        <td class="status-${o.Status}">${o.Status}</td>
                        <td>
                            ${o.Status === 'Pending' ? `<button onclick="completeOrder(${o.Id})">完成</button>` : ''}
                            ${o.Status === 'Pending' ? `<button class="danger" onclick="cancelOrder(${o.Id})">取消</button>` : ''}
                        </td>
                    </tr>
                `).join('');
                document.getElementById('last-refresh-time').innerText = '上次刷新: ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error('Fetch orders error:', e);
            }
        }

        async function exportOrders() {
            try {
                const res = await fetch('/api/admin/orders/export', {
                    headers: { 'x-admin-password': adminPassword }
                });
                if (!res.ok) throw new Error('导出失败');
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `orders_${new Date().toLocaleDateString()}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) { alert(e.message); }
        }

        async function clearAllOrders() {
            if (!confirm('确定清空所有订单记录吗？此操作不可恢复！')) return;
            try {
                await api('/api/admin/orders', 'DELETE');
                refreshAll();
            } catch (e) { alert('清销失败: ' + e.message); }
        }

        async function cancelOrder(id) {
            if (!confirm('确定取消该订单吗？')) return;
            try {
                await api(`/api/orders/${id}`, 'PUT', { status: 'Cancelled' });
                fetchOrders();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function fetchMenu() {
            try {
                const res = await api('/api/admin/menu'); 
                const data = await res.json();
                document.getElementById('menu-list').innerHTML = data.map(m => `
                    <tr>
                        <td><input type="text" value="${m.Name}" id="name-${m.Id}" style="width:100px"></td>
                        <td><input type="number" value="${m.Price}" id="price-${m.Id}" style="width:60px"></td>
                        <td><input type="text" value="${m.Description || ''}" id="desc-${m.Id}" style="width:120px"></td>
                        <td>
                            <div style="display:flex; flex-direction:column; gap:5px">
                                <input type="number" value="${m.StockQuantity}" id="stock-${m.Id}" style="width:60px" placeholder="库存">
                                <input type="text" value="${m.CustomOptions || ''}" id="options-${m.Id}" placeholder="无自定义选项" style="width:150px; font-size:12px; cursor:pointer" readonly onclick="openOptionsEditor('options-${m.Id}')">
                                <button onclick="updateMenu(${m.Id}, ${m.IsAvailable})" style="padding: 4px">保存更新</button>
                            </div>
                        </td>
                        <td style="color: ${m.StockQuantity > 0 && m.IsAvailable ? 'green' : 'red'}">
                            ${m.IsAvailable ? (m.StockQuantity > 0 ? '在售' : '已售罄') : '已下架'}
                        </td>
                        <td>
                            <button onclick="toggleMenu(${m.Id}, ${m.IsAvailable})">${m.IsAvailable ? '下架' : '上架'}</button>
                            <button class="danger" onclick="deleteMenu(${m.Id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Fetch menu error:', e);
            }
        }

        async function updateMenu(id, isAvailable) {
            const name = document.getElementById('name-' + id).value;
            const price = document.getElementById('price-' + id).value;
            const description = document.getElementById('desc-' + id).value;
            const stockQuantity = document.getElementById('stock-' + id).value;
            const customOptions = document.getElementById('options-' + id).value;
            try {
                await api(`/api/admin/menu/${id}`, 'PUT', { name, price, isAvailable, stockQuantity, description, customOptions });
                alert('已更新');
                fetchMenu();
            } catch (e) { alert('更新失败: ' + e.message); }
        }

        async function toggleMenu(id, currentStatus) {
            const name = document.getElementById('name-' + id).value;
            const price = document.getElementById('price-' + id).value;
            const description = document.getElementById('desc-' + id).value;
            const stockQuantity = document.getElementById('stock-' + id).value;
            const customOptions = document.getElementById('options-' + id).value;
            try {
                await api(`/api/admin/menu/${id}`, 'PUT', { name, price, isAvailable: !currentStatus, stockQuantity, description, customOptions });
                fetchMenu();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function completeOrder(id) {
            try {
                await api(`/api/orders/${id}`, 'PUT', { status: 'Completed' });
                fetchOrders();
            } catch (e) { alert('操作失败: ' + e.message); }
        }

        async function addMenuItem() {
            try {
                const name = document.getElementById('m-name').value;
                const price = document.getElementById('m-price').value;
                const description = document.getElementById('m-desc').value || '';
                const stockQuantity = document.getElementById('m-stock').value || 0;
                const customOptions = document.getElementById('m-options').value || '';
                if (!name || !price) return alert('请填写名称和价格');
                await api('/api/admin/menu', 'POST', { name, price, description, category: 'Coffee', stockQuantity, customOptions });
                fetchMenu();
                document.getElementById('m-name').value = '';
                document.getElementById('m-price').value = '';
                document.getElementById('m-desc').value = '';
                document.getElementById('m-stock').value = '';
                document.getElementById('m-options').value = '';
            } catch (e) { alert('添加失败: ' + e.message); }
        }

        async function deleteMenu(id) {
            if (confirm('确定删除吗？（如果该咖啡已有订单记录，删除可能会失败，建议使用“下架”）')) {
                try {
                    await api(`/api/admin/menu/${id}`, 'DELETE');
                    fetchMenu();
                } catch (e) {
                    alert('删除失败：此商品可能已有历史点单关联，数据库禁止删除。请点击“下架”来隐藏它。');
                }
            }
        }

        function refreshAll() {
            fetchOrders();
            fetchMenu();
            fetchSettings();
        }
    </script>
